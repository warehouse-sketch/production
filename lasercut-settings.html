<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Cutting Settings HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Force body and root to scroll properly */
        html, body {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020617;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }
        
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Interactive Scanline Overlay without blocking clicks */
        .hud-scanline {
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.25)
            );
            background-size: 100% 4px;
        }

        /* Custom HUD Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
            border-left: 1px solid #075985;
        }
        ::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 2px;
            border: 1px solid #38bdf8;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        /* Industrial HUD Glows & Card Aesthetics */
        .cyan-glow {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7), 0 0 20px rgba(14, 165, 233, 0.5);
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.35);
            position: relative;
        }
        .hud-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 10px;
            height: 10px;
            border-top: 2px solid #38bdf8;
            border-left: 2px solid #38bdf8;
            pointer-events: none;
        }
        .hud-card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-bottom: 2px solid #38bdf8;
            border-right: 2px solid #38bdf8;
            pointer-events: none;
        }
        .hud-card:hover {
            border-color: rgba(56, 189, 248, 0.85);
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.35), inset 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .cyan-border-bottom {
            border-bottom: 2px solid #0284c7;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        /* Custom notifications modal style */
        .toast-msg {
            animation: fadeInOut 2.5s ease-in-out forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>

                name: "Basswood 3/32\"",
                pn: "14123",
                diameter: "N/A",
                category: "Basswood",
                cuts: [{ type: "Cut", speed: "30", power: "85", freq: "50" }],
                engraves: [{ type: "Engrave / Raster", speed: "40", power: "5", freq: "50" }]
            },
            {
                name: "Basswood 1/8\"",
                pn: "14121",
                diameter: "N/A",
                category: "Basswood",
                cuts: [{ type: "Cut", speed: "25", power: "85", freq: "50" }],
                engraves: []
            },
            {
                name: "Corrugated Cardboard",
                pn: "44007",
                diameter: "N/A",
                category: "Cardboard",
                cuts: [{ type: "Cut", speed: "35", power: "50", freq: "50" }],
                engraves: [{ type: "Engrave / Raster", speed: "50", power: "8", freq: "50" }]
            },
            {
                name: "10.5mm Tube",
                pn: "N/A",
                diameter: "OD: 0.466\" | ID: 0.422\"",
                category: "AT",
                cuts: [],
                engraves: []
            },
            {
                name: "98mm / 4\" Tube",
                pn: "N/A",
                diameter: "OD: 3.990\" | ID: N/A",
                category: "AT",
                cuts: [{ type: "Cut", speed: "40", power: "20", freq: "50" }],
                engraves: []
            }
        ];

        let currentCategory = 'All';
        let searchQuery = '';

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.textContent = message;
            toast.classList.remove('hidden');
            toast.classList.add('toast-msg');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-msg');
            }, 2500);
        }

        function copySpecToClipboard(text) {
            // Reliable copy mechanism for iFrames and preview wrappers
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`COPIED SPEC: ${text}`);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textarea);
        }

        function renderMaterials() {
            const grid = document.getElementById('materialGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            const filtered = materialsData.filter(item => {
                const matchesCat = currentCategory === 'All' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.pn.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      item.diameter.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(mat => {
                let cutsHtml = mat.cuts.length > 0 ? mat.cuts.map(c => `
                    <div class="bg-sky-950/40 border border-sky-800/60 p-2 text-xs relative">
                        <div class="font-bold text-sky-400 mb-1 flex items-center justify-between font-orbitron text-[11px]">
                            <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-sky-400 inline-block"></span> ${c.type}</span>
                            <span class="text-sky-400/80 font-mono text-[10px]">FREQ: ${c.freq}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-slate-300 font-mono text-[11px]">
                            <div>SPD: <span class="font-bold text-sky-200">${c.speed}</span></div>
                            <div>PWR: <span class="font-bold text-sky-200">${c.power}</span></div>
                        </div>
                    </div>
                `).join('') : '<p class="text-[11px] text-slate-500 italic py-1 font-mono">SETTINGS NOT SPECIFIED</p>';

                let engravesHtml = mat.engraves.length > 0 ? mat.engraves.map(e => `
                    <div class="bg-cyan-950/40 border border-cyan-800/60 p-2 text-xs relative">
                        <div class="font-bold text-cyan-400 mb-1 flex items-center justify-between font-orbitron text-[11px]">
                            <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-cyan-400 inline-block"></span> ${e.type}</span>
                            <span class="text-cyan-400/80 font-mono text-[10px]">FREQ: ${e.freq}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-slate-300 font-mono text-[11px]">
                            <div>SPD: <span class="font-bold text-cyan-200">${e.speed}</span></div>
                            <div>PWR: <span class="font-bold text-cyan-200">${e.power}</span></div>
                        </div>
                    </div>
                `).join('') : '';

                const copyPayload = `${mat.name} (P/N: ${mat.pn}) [Diameter: ${mat.diameter}]`;

                const card = document.createElement('div');
                card.className = "hud-card p-4 flex flex-col justify-between transition-all duration-200";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2.5 border-b border-sky-900/60 pb-2">
                            <h2 class="font-orbitron font-bold text-sm text-sky-100 tracking-wide">${mat.name}</h2>
                            <span class="bg-slate-900 text-sky-400 font-mono text-[10px] px-1.5 py-0.5 border border-sky-700/60 whitespace-nowrap">P/N: ${mat.pn}</span>
                        </div>
                        
                        <div class="mb-3">
                            <span class="inline-flex items-center justify-between text-[11px] text-sky-300 bg-sky-950/60 px-2.5 py-1 border border-sky-800/70 w-full font-mono">
                                <span class="text-sky-500 font-bold uppercase text-[10px]">Diameter:</span>
                                <span class="font-bold text-sky-100">${mat.diameter}</span>
                            </span>
                        </div>

                        <div class="space-y-3 mt-2">
                            <div>
                                <h3 class="text-[10px] uppercase font-mono font-bold text-sky-400 mb-1 flex items-center gap-1">
                                    <span class="text-sky-500">[►]</span> CUT PARAMETERS
                                </h3>
                                <div class="space-y-1.5">${cutsHtml}</div>
                            </div>
                            
                            ${engravesHtml ? `
                            <div>
                                <h3 class="text-[10px] uppercase font-mono font-bold text-cyan-400 mb-1 flex items-center gap-1">
                                    <span class="text-cyan-500">[►]</span> ENGRAVE / RASTER
                                </h3>
                                <div class="space-y-1.5">${engravesHtml}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-2.5 border-t border-sky-950 flex justify-between items-center text-[10px] font-mono text-slate-500">
                        <span>CLASS: <strong class="text-sky-400 uppercase font-orbitron text-[9px]">${mat.category}</strong></span>
                        <button onclick="copySpecToClipboard('${copyPayload}')" class="hover:text-sky-300 transition-colors flex items-center gap-1 text-sky-400 uppercase tracking-wider cursor-pointer active:scale-95">
                            <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                            COPY HUD SPEC
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-sky-950', 'text-sky-200', 'border-sky-400');
                btn.classList.add('text-slate-400', 'border-slate-800');
            });
            const activeBtn = document.getElementById(`cat-${category}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400', 'border-slate-800');
                activeBtn.classList.add('bg-sky-950', 'text-sky-200', 'border-sky-400');
            }
            renderMaterials();
        }

        // Attach Search Input Listener
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderMaterials();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderMaterials();
            searchInput.focus();
        });

        // Initialize on page load
        window.onload = () => {
            renderMaterials();
        };
    </script>
</body>
</html>
