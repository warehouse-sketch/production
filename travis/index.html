<html lang="en" class="h-full bg-black">

    <title>Laser Cutter Crypt Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #080308;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(136, 19, 55, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(88, 28, 135, 0.12) 0%, transparent 50%);
        }
        .font-creepster {
            font-family: 'Creepster', cursive;
        }
        .font-cinzel {
            font-family: 'Cinzel Decorative', serif;
        }
        
        /* Custom scrollbar for gothic vibe */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d040e;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c0519;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #881337;
        }

        /* Horror Glow Effects */
        .crimson-glow {
            text-shadow: 0 0 10px rgba(225, 29, 72, 0.7), 0 0 20px rgba(159, 18, 57, 0.5);
        }
        .blood-card {
            background: linear-gradient(145deg, rgba(20, 5, 22, 0.9) 0%, rgba(10, 2, 12, 0.95) 100%);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(136, 19, 55, 0.15);
            border: 1px solid rgba(136, 19, 55, 0.4);
        }
        .blood-card:hover {
            border-color: rgba(225, 29, 72, 0.8);
            box-shadow: 0 0 25px rgba(159, 18, 57, 0.4), inset 0 0 20px rgba(225, 29, 72, 0.2);
        }

        /* Blood Drip Accent Line */
        .blood-border-bottom {
            border-bottom: 2px solid #881337;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
        }
    </style>
</head>

        </div>
    </nav>

        let currentCategory = 'All';
        let searchQuery = '';

        function renderMaterials() {
            const grid = document.getElementById('materialGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            const filtered = materialsData.filter(item => {
                const matchesCat = currentCategory === 'All' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.pn.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(mat => {
                let cutsHtml = mat.cuts.map(c => `
                    <div class="bg-red-950/20 border border-rose-900/40 rounded p-2 text-xs">
                        <div class="font-bold text-rose-500 mb-1 flex items-center justify-between font-cinzel">
                            <span>☠ ${c.type}</span>
                            <span class="text-rose-400/70 text-[10px]">FREQ: ${c.freq}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-stone-300">
                            <div>SPEED: <span class="font-mono font-bold text-rose-300">${c.speed}</span></div>
                            <div>POWER: <span class="font-mono font-bold text-rose-300">${c.power}</span></div>
                        </div>
                    </div>
                `).join('');

                let engravesHtml = mat.engraves.length > 0 ? mat.engraves.map(e => `
                    <div class="bg-purple-950/20 border border-purple-900/40 rounded p-2 text-xs">
                        <div class="font-bold text-purple-400 mb-1 flex items-center justify-between font-cinzel">
                            <span>🩸 ${e.type}</span>
                            <span class="text-purple-300/70 text-[10px]">FREQ: ${e.freq}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-stone-300">
                            <div>SPEED: <span class="font-mono font-bold text-purple-300">${e.speed}</span></div>
                            <div>POWER: <span class="font-mono font-bold text-purple-300">${e.power}</span></div>
                        </div>
                    </div>
                `).join('') : '<p class="text-[11px] text-stone-600 italic py-1">No ritual engraving ritual needed</p>';

                const card = document.createElement('div');
                card.className = "blood-card rounded-lg p-5 flex flex-col justify-between transition-all duration-300";

                            <span class="bg-stone-950 text-rose-400 font-mono text-[10px] px-2 py-0.5 rounded border border-rose-900/60">P/N: ${mat.pn}</span>

                                    Laser Cut Ritual

                            </div>
                            
                            <div>

                                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"/></svg>
                                    Raster & Engrave Ritual

                        </div>
                    </div>
                    
                    <div class="mt-5 pt-3 border-t border-stone-900 flex justify-between items-center text-[10px] text-stone-500">
                        <span>Class: <strong class="text-rose-400 uppercase font-cinzel">${mat.category}</strong></span>
                        <button onclick="navigator.clipboard.writeText('${mat.name} (P/N: ${mat.pn})');" class="hover:text-rose-400 transition-colors flex items-center gap-1 text-stone-400 uppercase tracking-wider">
                            <svg class="w-3 h-3 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                            Copy Incantation
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-rose-950', 'text-rose-200', 'border-rose-600');
                btn.classList.add('text-stone-400', 'border-stone-800');
            });
            const activeBtn = document.getElementById(`cat-${category}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-stone-400', 'border-stone-800');
                activeBtn.classList.add('bg-rose-950', 'text-rose-200', 'border-rose-600');
            }
            renderMaterials();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderMaterials();
        });

        window.onload = () => {
            renderMaterials();
        };
    </script>
</body>
</html>
